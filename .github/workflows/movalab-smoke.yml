name: MovaLab alpha smoke

on:
  push:
    branches: [master]
    paths:
      - 'tools/movalab/**'
      - '.github/workflows/movalab-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated 3D viewer dependencies
        run: npm install --prefix tools/movalab/app --no-audit --no-fund
      - name: Verify browser 3D vendor files
        run: |
          test -f tools/movalab/app/node_modules/three/build/three.module.js
          test -f tools/movalab/app/node_modules/three/examples/jsm/loaders/FBXLoader.js
      - name: Check MovaLab syntax
        run: |
          node --check tools/movalab/service/server.cjs
          node --check tools/movalab/service/pack-library.cjs
          node --check tools/movalab/scripts/start.cjs
          node --check tools/movalab/app/viewer3d.js
          node --check tools/movalab/app/main.js
          node --check tools/movalab/tests/app.cjs
          node --check tools/movalab/src/fbx-binary.cjs
          node --check tools/movalab/src/rig-v2.cjs
      - name: MovaLab local API and UI smoke
        run: node tools/movalab/tests/app.cjs
      - name: Audit FBX 6100 and binary packs
        run: node tools/movalab/tests/pack-audit.cjs
      - name: Preserve Aruan game regressions
        run: npm test
