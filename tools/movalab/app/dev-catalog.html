<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo DEV · ARUAN</title><link rel="stylesheet" href="/dev-catalog.css"><script src="/dev-catalog.js" defer></script></head>
<body>
<header><h1>Catálogo DEV</h1><p>Prévia isolada do combate · fontes existentes · preparação offline</p></header>
<form id="search-form"><input id="search" type="search" placeholder="Nome, descrição ou categoria em português/inglês" aria-label="Buscar animação"><select id="category" aria-label="Categoria"><option value="">Todas as categorias</option><option>Caminhada</option><option>Corrida</option><option>Idle</option><option>Combate</option><option>Ataques</option><option>Esquiva</option><option>Saltos</option><option>Gestos</option><option>Reações</option><option>Dança</option><option>Cinemática</option><option>Outros</option></select><select id="stage" aria-label="Estado"><option value="">Todos os estados</option><option value="canvas-preview">Prévia disponível</option><option value="source-present">Fonte presente</option><option value="prepare-failed">Falha no preparo</option><option value="needs-adjustment">Requer ajuste</option></select><label><input id="favorites" type="checkbox">Favoritos</label><button>Buscar</button></form>
<p id="status" role="status">Conectando ao catálogo local…</p>
<main><section><div id="results" aria-label="Animações"></div><button id="more" hidden>Carregar mais</button></section><section id="preview">
<iframe id="canvas" src="/aruan-preview.html" title="Mesmo renderer Canvas do jogo"></iframe>
<div class="controls"><button id="play" disabled>Pausar</button><label>Velocidade <select id="speed"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>Direção <select id="direction"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select></label><label><input id="loop" type="checkbox" checked>Repetir prévia</label><label><input id="bones" type="checkbox">Ossos</label></div>
<label>Tempo <input id="time" type="range" min="0" max="1" step="0.001" value="0" disabled></label>
<pre id="details">Selecione uma animação. Nenhum binding de gameplay será alterado.</pre></section></main>
</body></html>
